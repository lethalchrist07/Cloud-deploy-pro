
name: CD - Staging

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - uses: actions/checkout@v3

    # Set up AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Set up Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    # Set up Node.js for building frontend
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    # Set up Python for building backend
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and push backend Docker image
    - name: Build and push backend image
      run: |
        cd backend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/clouddeploy-pro-backend:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/clouddeploy-pro-backend:${{ github.sha }}

    # Build and push frontend Docker image
    - name: Build and push frontend image
      run: |
        cd frontend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/clouddeploy-pro-frontend:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/clouddeploy-pro-frontend:${{ github.sha }}

    # Terraform initialization and planning for staging
    - name: Terraform Init
      run: |
        cd terraform/staging
        terraform init

    - name: Terraform Plan
      run: |
        cd terraform/staging
        terraform plan -var-file="staging.tfvars" -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform/staging
        terraform apply -auto-approve tfplan

    # Now we need to deploy the application to the EC2 instance
    # We'll get the instance public IP from the Terraform output
    - name: Get instance public IP
      id: get_ip
      run: |
        cd terraform/staging
        INSTANCE_IP=$(terraform output -raw instance_public_ip)
        echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

    # SSH into the EC2 instance and deploy the containers
    - name: Deploy application
      env:
        INSTANCE_IP: ${{ steps.get_ip.outputs.instance_ip }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        # Wait for SSH to be ready (max 60 seconds)
        for i in {1..12}; do
          if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i <(echo "$SSH_PRIVATE_KEY") ubuntu@$INSTANCE_IP true; then
            break
          fi
          echo "Waiting for SSH..."
          sleep 5
        done

        # Create the directory for docker-compose on the EC2 instance
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i <(echo "$SSH_PRIVATE_KEY") ubuntu@$INSTANCE_IP << 'EOF'
          sudo mkdir -p /opt/clouddeploy-pro
          cd /opt/clouddeploy-pro
          # Write a docker-compose.yml file that uses the images we just pushed
          cat > docker-compose.yml << 'EOFF'
          version: '3.8'
          services:
            backend:
              image: ${{ secrets.DOCKER_USERNAME }}/clouddeploy-pro-backend:${{ github.sha }}
              ports:
                - "8000:8000"
              environment:
                - ENVIRONMENT=staging
                - APP_VERSION=1.0.0
                - GIT_COMMIT=${{ github.sha }}
                - DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              restart: unless-stopped
            frontend:
              image: ${{ secrets.DOCKER_USERNAME }}/clouddeploy-pro-frontend:${{ github.sha }}
              ports:
                - "3000:80"
              environment:
                - NODE_ENV=production
              restart: unless-stopped
          EOFF
          # Pull the latest images
          docker-compose pull
          # Start the services
          docker-compose up -d
          # Wait a bit for the services to start
          sleep 10
          # Run a health check
          curl -f http://localhost:8000/health || echo "Health check failed"
        EOF