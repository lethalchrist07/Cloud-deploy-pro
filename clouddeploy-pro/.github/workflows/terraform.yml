name: Terraform

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      run: |
        cd terraform/${{ matrix.environment }}
        terraform fmt -check -recursive

    - name: Terraform Init
      run: |
        cd terraform/${{ matrix.environment }}
        terraform init

    - name: Terraform Validate
      run: |
        cd terraform/${{ matrix.environment }}
        terraform validate

    - name: Terraform Plan
      run: |
        cd terraform/${{ matrix.environment }}
        # We don't have the tfvars for the environment in the PR context? We'll use the default ones.
        # But we can pass the tfvars file if it exists.
        if [ -f "${{ matrix.environment }}.tfvars" ]; then
          terraform plan -var-file="${{ matrix.environment }}.tfvars"
        else
          terraform plan
        fi