name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        # We'll test both backend and frontend in separate steps, but we can use one job for simplicity

    steps:
    - uses: actions/checkout@v3

    # Set up Python for backend
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # Set up Node.js for frontend
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    # Cache Node.js modules
    - name: Cache Node.js modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    # Cache Python packages
    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Install backend dependencies
    - name: Install backend dependencies
      run: |
        cd backend
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    # Install frontend dependencies
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    # Run backend tests
    - name: Run backend tests
      run: |
        cd backend
        source venv/bin/activate
        python -m pytest tests/ -v

    # Run frontend tests
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --run

    # Lint backend (flake8)
    - name: Lint backend
      run: |
        cd backend
        source venv/bin/activate
        flake8 app/ tests/ --max-line-length=127 || echo "Linting failed"

    # Lint frontend (eslint)
    - name: Lint frontend
      run: |
        cd frontend
        npx eslint src --ext .ts,.tsx

    # Format check (prettier)
    - name: Format check
      run: |
        cd frontend
        npx prettier --check src --ext .ts,.tsx

    # Security scan for backend (bandit)
    - name: Security scan backend
      run: |
        cd backend
        source venv/bin/activate
        bandit -r app/ -f json -o bandit-report.json || echo "Bandit scan completed"

    # Security scan for frontend (npm audit)
    - name: Security scan frontend
      run: |
        cd frontend
        npm audit --audit-level=high

    # Build Docker images (optional, but we can do it in CD)
    # We'll leave the image building to the CD workflow to avoid building twice