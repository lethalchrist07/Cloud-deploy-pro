<!DOCTYPE html><html><body><h2>Testing CORS and connectivity</h2><div id='output'></div><script>fetch('http://localhost:8000/metrics').then(r => r.json()).then(data => { document.getElementById('output').innerHTML = '<h3>Success:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>'; }).catch(err => { document.getElementById('output').innerHTML = '<h3 style="color:red">Error:</h3><p>' + err.message + '</p>'; });</script></body></html>
