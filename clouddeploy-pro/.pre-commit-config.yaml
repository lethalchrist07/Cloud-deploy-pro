repos:
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0
    hooks:
      - id: hadolint-docker
        name: Hadolint - Lint Dockerfiles
        description: Checks docker build files for problems
        entry: hadolint
        language: docker
        types: [dockerfile]
        exclude: ^\.github
        args: ['--ignore=DL3008', '--ignore=DL3009']  # Ignore specific warnings if needed

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, typescript, json, yaml, markdown]
        exclude: ^(node_modules|\.next|build|dist)
