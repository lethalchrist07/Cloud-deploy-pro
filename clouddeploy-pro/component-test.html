<!DOCTYPE html><html><body><h2>Testing Fetch from Component Context</h2><div id="output"></div><script>// Simulate what the dashboard component does async function testComponentFetch() { try { console.log("Component: Attempting to fetch from http://localhost:8000/metrics"); const response = await fetch("http://localhost:8000/metrics"); console.log("Component: Received response:", response); console.log("Component: Response ok:", response.ok); console.log("Component: Response status:", response.status); if (!response.ok) { throw new Error("HTTP " + response.status + ": " + response.statusText); } const data = await response.json(); console.log("Component: Parsed data:", data); // This is what the component does: setSystemData(data.system || data); const systemData = data.system || data; console.log("Component: System data to be set:", systemData); document.getElementById("output").innerHTML = "<h3>Success:</h3><pre>" + JSON.stringify(systemData, null, 2) + "</pre>"; } catch (error) { // This is the improved error handling from our component console.error("Component: Error fetching system data:", { message: error.message || "Unknown error", type: error.constructor.name, stack: error.stack || "No stack trace available", ...(error.cause && { cause: error.cause }) }); console.error("Component: Error type:", typeof error); console.error("Component: Error message:", error.message || "Unknown error"); console.error("Component: Error name:", error.name || "Error"); console.error("Component: Error stack:", error.stack || "No stack trace available"); document.getElementById("output").innerHTML = "<h3 style=\"color:red\">Error:</h3><p>" + error.message + "</p>"; } } testComponentFetch();</script></body></html>
