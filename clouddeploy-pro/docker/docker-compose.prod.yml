services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: clouddeploy-pro-backend-prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=false
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '1.5'
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - clouddeploy-pro-network-prod

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: clouddeploy-pro-frontend-prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.75'
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - clouddeploy-pro-network-prod

networks:
  clouddeploy-pro-network-prod:
    driver: bridge
