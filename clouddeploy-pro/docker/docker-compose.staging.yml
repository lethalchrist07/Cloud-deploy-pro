services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: clouddeploy-pro-backend-staging
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=staging
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=false
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - clouddeploy-pro-network-staging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: clouddeploy-pro-frontend-staging
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - clouddeploy-pro-network-staging

networks:
  clouddeploy-pro-network-staging:
    driver: bridge
