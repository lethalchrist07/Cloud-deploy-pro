version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - APP_VERSION=1.0.0
      # GIT_COMMIT and DEPLOYED_AT would be set by CI/CD in production
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # Optional: Add a reverse proxy like nginx or traefik if needed
  # For simplicity, we are exposing the frontend directly on port 3000 and backend on 8000