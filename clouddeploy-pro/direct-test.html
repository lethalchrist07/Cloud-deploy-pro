<!DOCTYPE html><html><body><h2>Direct Fetch Test from Browser Context</h2><div id='output'></div><script>async function testFetch() { try { const response = await fetch('http://localhost:8000/metrics'); console.log('Response:', response); console.log('Response ok:', response.ok); if (!response.ok) { throw new Error('HTTP ' + response.status + ': ' + response.statusText); } const data = await response.json(); console.log('Data:', data); document.getElementById('output').innerHTML = '<h3>Success:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>'; } catch (error) { console.error('Error:', error); document.getElementById('output').innerHTML = '<h3 style="color:red">Error:</h3><p>' + error.message + '</p><pre>' + JSON.stringify(error, null, 2) + '</pre>'; } } testFetch();</script></body></html>
